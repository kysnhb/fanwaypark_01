<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>불칸 8월 서비스 계획</title>
<style>
  :root{--dev:#2563eb;--biz:#16a34a;--ops:#ea580c;--mkt:#9333ea;--mgmt:#dc2626;--bg:#fff;--sb:#f6f7f9;--txt:#1a2029;--sub:#6b7684;--line:#e6e9ee;--accent:#3b6cf6;--gold:#b07d00;--hover:#eef1f6;--hold:#f59e0b;--wait:#94a3b8;--go:#16a34a;--sbw:270px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);font-family:'Malgun Gothic','맑은 고딕',-apple-system,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  #login{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#eef2f8,#dbe3ee);display:flex;align-items:center;justify-content:center;z-index:200}
  .lbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 32px;width:330px;box-shadow:0 24px 60px rgba(30,50,90,.18)}
  .lbox h1{font-size:21px;text-align:center;margin-bottom:4px}.lbox .s{text-align:center;color:var(--sub);font-size:13px;margin-bottom:20px}
  .lbox input{width:100%;padding:12px 14px;margin-bottom:11px;background:#f7f9fc;border:1px solid var(--line);border-radius:9px;font-size:14px}
  .lbox button{width:100%;padding:12px;background:linear-gradient(90deg,#3b6cf6,#5b8bff);border:0;border-radius:9px;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .lerr{color:#e0435a;font-size:13px;text-align:center;height:18px;margin-top:4px}.lhint{margin-top:12px;font-size:11px;color:var(--sub);text-align:center;line-height:1.6}
  #app{display:none}
  .topbar{position:sticky;top:0;z-index:60;height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px}
  .burger{display:none;font-size:22px;background:none;border:0;cursor:pointer;color:var(--txt)}
  .brand{font-weight:800;font-size:16px}.brand span{color:var(--gold)}
  .who{margin-left:auto;font-size:13px;color:var(--sub)}.who b{color:var(--txt)}
  .lo{margin-left:10px;padding:5px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--sub);cursor:pointer;font-size:12px}
  .layout{display:flex;min-height:calc(100vh - 54px)}
  .side{width:var(--sbw);flex:0 0 var(--sbw);background:var(--sb);border-right:1px solid var(--line);padding:16px 10px 60px;position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto}
  .side .grp{font-size:11px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.3px;padding:14px 12px 6px}
  .nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 12px;border-radius:8px;border:0;background:none;color:var(--txt);font-size:14px;cursor:pointer;font-family:inherit}
  .nav:hover{background:var(--hover)}.nav.on{background:#e7eefe;color:var(--accent);font-weight:700}
  .nav .ic{width:18px;text-align:center}.nav .pin{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700}
  .pin.hold{background:#fef3c7;color:#b45309}.pin.go{background:#dcfce7;color:#15803d}
  .content{flex:1;min-width:0;padding:30px 34px 90px;max-width:940px}
  .page{display:none}.page.on{display:block;animation:fade .2s}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  h1.t{font-size:26px;margin-bottom:6px}.lead{color:var(--sub);font-size:15px;margin-bottom:22px}
  h2.h{font-size:18px;margin:26px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  p{margin-bottom:10px}.muted{color:var(--sub);font-size:13px}
  .stat{display:flex;flex-direction:column;gap:12px;margin:8px 0 20px}
  .sc{border:1px solid var(--line);border-left:4px solid var(--hold);border-radius:11px;padding:15px 18px;background:#fff}
  .sc.wait{border-left-color:var(--wait)}.sc.go{border-left-color:var(--go)}
  .sc .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sc h3{font-size:16px}
  .badge{font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px}
  .bg-hold{background:#fef3c7;color:#b45309}.bg-wait{background:#eef1f6;color:#64748b}.bg-go{background:#dcfce7;color:#15803d}
  .sc .dep{color:var(--sub);font-size:13px;margin-top:7px}.sc .dep b{color:var(--txt)}
  .banner{background:#fff8e6;border:1px solid #f5e2b0;border-radius:11px;padding:14px 18px;font-size:14px;color:#8a6d1e;margin:6px 0 18px}.banner b{color:#6b520f}
  .cs-banner{background:#fdeef0;border:1px solid #f3c6cd;border-radius:11px;padding:12px 16px;font-size:13.5px;color:#9b2c3a;margin:6px 0 16px}.cs-banner b{color:#7a1f2b}
  .info{background:#eef4ff;border:1px solid #cfe0ff;border-radius:11px;padding:12px 16px;font-size:13.5px;color:#274690;margin:6px 0 16px}.info b{color:#1a2f66}
  .wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px;margin:6px 0 16px}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
  th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:#f4f6f9;font-weight:700;color:#3a4552;white-space:nowrap}tr:last-child td{border-bottom:0}
  .cash{font-weight:800;color:var(--gold);white-space:nowrap}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .t-cp{background:#e7eefe;color:#3b6cf6}.t-ms{background:#fef3c7;color:#b45309}.t-new{background:#dcfce7;color:#15803d}.t-mg{background:#f3e8ff;color:#7e22ce}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0}
  .cal .hd{text-align:center;font-weight:700;color:var(--sub);font-size:12px;padding:4px 0}.cal .hd.sun{color:#e0435a}.cal .hd.sat{color:#3b6cf6}
  .cell{border:1px solid var(--line);border-radius:9px;min-height:74px;padding:6px;background:#fff;font-size:11px}
  .cell.empty{background:#fafbfc;border-style:dashed}
  .cell.clk{cursor:pointer;transition:.12s}.cell.clk:hover{border-color:var(--accent);box-shadow:0 3px 10px rgba(59,108,246,.15);transform:translateY(-1px)}
  .cell .d{font-weight:800;font-size:12px}.cell.sun .d{color:#e0435a}.cell.sat .d{color:#3b6cf6}
  .cell .mt{margin-top:4px;border-left:3px solid var(--mgmt);background:#fdf0f0;padding:2px 5px;border-radius:4px;font-size:10px}
  .cell .goic{float:right;color:var(--accent);font-size:11px}.cell .ph{color:#c3cbd5;margin-top:8px;font-size:10px;text-align:center}
  .rcal{display:grid;grid-template-columns:60px repeat(7,1fr);gap:5px;margin:6px 0;min-width:640px}
  .rcal .rh{font-weight:700;font-size:11px;color:var(--sub);text-align:center;padding:5px 0;align-self:center}
  .rcal .rh.sat{color:#3b6cf6}.rcal .rh.sun{color:#e0435a}
  .rcal .rw{font-weight:800;font-size:12px;background:#f4f6f9;border-radius:8px;display:flex;align-items:center;justify-content:center}
  .rcal .rc{border:1px solid var(--line);border-radius:8px;padding:6px;min-height:52px;font-size:10.5px;background:#fff}
  .rcal .rc.we{background:#fff8e6;border-color:#f0dca0}
  .rcal .base{color:#94a3b8}.rcal .sp{color:#b45309;font-weight:700;margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px;margin:6px 0 18px}
  .card{border:1px solid var(--line);border-radius:12px;padding:15px 17px;background:#fff}
  .card h3{font-size:15px;margin-bottom:7px;display:flex;align-items:center;gap:7px}.card .price{color:var(--gold);font-weight:800}
  .card ul{list-style:none;margin-top:6px}.card li{padding:3px 0 3px 15px;position:relative;font-size:13px;color:#42505e}
  .card li:before{content:"◆";position:absolute;left:0;top:4px;color:var(--accent);font-size:8px}
  .pill{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;margin-left:auto}
  .p-ok{background:#dcfce7;color:#15803d}.p-con{background:#e7eefe;color:#3b6cf6}.p-dev{background:#ffedd5;color:#c2410c}.p-cs{background:#fdeef0;color:#b91c40}
  .free{background:#eef1f6;color:#475569;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}.prem{background:#fff4d6;color:#b45309;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
  .map th{background:#fbeaea}.map td:nth-child(2){text-align:center;color:#dc2626;font-weight:700;width:36px}
  .note{background:var(--sb);border:1px dashed var(--line);border-radius:10px;padding:12px 15px;font-size:13px;color:var(--sub);margin:8px 0}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0 16px}
  .kpi .b{border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:#fff}.kpi .n{font-size:22px;font-weight:800;color:var(--mgmt)}.kpi .l{font-size:12px;color:var(--sub)}
  .bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.bar .lb{width:150px;flex:0 0 150px}.bar .tr{flex:1;background:#f1f3f6;border-radius:6px;height:16px;overflow:hidden}
  .bar .fl{height:100%;background:linear-gradient(90deg,#e0435a,#f0788a)}.bar .vv{width:40px;text-align:right;font-weight:700;color:var(--mgmt)}
  .cform{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .cform select,.cform textarea{background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit}.cform textarea{flex:1;min-width:220px;min-height:44px;resize:vertical}
  .cform button{background:linear-gradient(90deg,#3b6cf6,#5b8bff);border:0;border-radius:8px;color:#fff;font-weight:700;padding:0 20px;cursor:pointer}
  .clist{display:flex;flex-direction:column;gap:9px}.cm{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff}
  .cm .meta{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:8px;margin-bottom:3px}.cm .meta b{color:var(--txt)}.cm .del{margin-left:auto;color:#e0435a;cursor:pointer;font-size:11px}
  .cm .ct{font-size:14px;white-space:pre-wrap}.catpill{font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px;color:#fff}
  .ov{display:none;position:fixed;inset:54px 0 0 0;background:rgba(20,30,50,.4);z-index:40}
  @media(max-width:900px){.side{position:fixed;top:54px;left:0;z-index:50;transform:translateX(-100%);transition:transform .22s;box-shadow:4px 0 24px rgba(0,0,0,.12)}body.sbopen .side{transform:none}body.sbopen .ov{display:block}.burger{display:block}.content{padding:20px 16px 80px}h1.t{font-size:22px}.bar .lb{width:110px;flex:0 0 110px}}

#gate{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#eef2f8,#dbe3ee);display:flex;align-items:center;justify-content:center;z-index:300}
</style>
</head>

  <input id="gpw" type="password" placeholder="비밀번호" autocomplete="off">
  <button onclick="unlock()">열기</button><div class="lerr" id="gerr"></div>

</div></div>

</div>

const _b = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function _dk(pw, salt, usage){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, [usage]);
}
async function unlock(){
  const pw = document.getElementById('gpw').value;
  const err = document.getElementById('gerr'); err.textContent='확인 중…';
  let found=null;
  for(const wrap of WRAPS){
    try{ const key=await _dk(pw,_b(wrap.s),'decrypt'); const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:_b(wrap.i)},key,_b(wrap.w)); found=JSON.parse(new TextDecoder().decode(pt)); break; }catch(e){}
  }
  if(!found){ err.textContent='비밀번호가 올바르지 않습니다.'; return; }
  try{
    const cek = await crypto.subtle.importKey('raw', _b(found.cek), {name:'AES-GCM'}, false, ['decrypt']);
    const raw = _b(CONTENT);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:raw.slice(0,12)}, cek, raw.slice(12));
    const js = new TextDecoder().decode(pt);
    sessionStorage.setItem('vulcan_user', found.name);
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    const s=document.createElement('script'); s.textContent=js; document.body.appendChild(s);
  }catch(e){ err.textContent='복호화 오류가 발생했습니다.'; }
}
document.getElementById('gpw').addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });
